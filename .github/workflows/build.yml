name: Build PROJECT TOOLS JEFF APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip and Build
        run: |
          # 1. Ekstrak zip yang lo upload
          unzip source.zip -d project_jeff
          cd project_jeff
          
          # 2. Masuk ke folder project kalau di dalam zip ada folder bersarang
          if [ -d "JeffTools78" ]; then cd JeffTools78; fi
          if [ -d "project tools jeff" ]; then cd "project tools jeff"; fi
          
          # 3. Bikin gradle wrapper
          if [ ! -f ./gradlew ]; then
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          fi
          
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 4. Build APK
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-TOOLS-JEFF-APK
          path: 'project_jeff/**/build/outputs/apk/debug/app-debug.apk'
