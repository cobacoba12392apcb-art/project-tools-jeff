name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unzip and Build
        run: |
          # Unzip file zip apa saja yang ada di repo
          for f in *.zip; do unzip "$f" -d project_build; done
          cd project_build
          
          # Cari folder yang ada settings.gradle.kts nya secara otomatis
          DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -1)
          if [ -n "$DIR" ]; then cd "$DIR"; fi
          
          # Bikin gradle wrapper
          if [ ! -f ./gradlew ]; then
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          fi
          
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Build APK
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-TOOLS-JEFF-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
